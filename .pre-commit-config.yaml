repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: eslint
        name: ESLint (frontend)
        entry: npx eslint src --ext .js,.jsx
        language: system
        files: frontend/.*\.(js|jsx)$
        working_directory: frontend
  - repo: local
    hooks:
      - id: checkstyle
        name: Checkstyle (backend)
        entry: sh -c "cd backend && ./mvnw -q checkstyle:check"
        language: system
        files: backend/.*\.java$
